<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Order</title>
<!-- Product database (must be loaded before the main script) -->
<script src="products.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; margin: 0; padding: 20px; background: #f4f4f4; color: #222; }
  .sheet { background: #fff; max-width: 1400px; margin: 0 auto; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  h1 { font-size: 20px; margin: 0 0 15px; text-align: center; letter-spacing: 1px; }
  fieldset { border: 1px solid #ccc; margin: 0 0 15px; padding: 12px; }
  legend { font-weight: bold; padding: 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 20px; }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: 11px; color: #555; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; }
  .field input { padding: 5px 7px; border: 1px solid #bbb; border-radius: 3px; font-size: 13px; font-family: inherit; }
  .field input:focus { outline: 2px solid #4a90e2; outline-offset: -1px; }
  .field input[readonly] { background: #f0f0f0; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid #999; padding: 4px 5px; vertical-align: top; }
  th { background: #e8eef5; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  td input { width: 100%; border: none; padding: 3px 4px; font-size: 12px; font-family: inherit; background: transparent; }
  td input:focus { outline: 2px solid #4a90e2; outline-offset: -2px; background: #fff; }
  td.num input { text-align: right; }
  td.calc { background: #fafafa; text-align: right; font-variant-numeric: tabular-nums; }

  .autocomplete { position: relative; }
  .ac-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #4a90e2; border-top: none; max-height: 220px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .ac-list div { padding: 5px 7px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #eee; }
  .ac-list div:hover, .ac-list div.active { background: #4a90e2; color: #fff; }
  .ac-list div .code { font-weight: bold; margin-right: 8px; }
  .ac-list div .packs { color: #888; float: right; }
  .ac-list div:hover .packs, .ac-list div.active .packs { color: #fff; }

  .row-btns { display: flex; gap: 10px; margin-top: 10px; }
  button { padding: 7px 15px; font-size: 12px; cursor: pointer; border: 1px solid #4a90e2; background: #4a90e2; color: #fff; border-radius: 3px; font-family: inherit; }
  button.secondary { background: #fff; color: #4a90e2; }
  button.danger { background: #fff; color: #c0392b; border-color: #c0392b; }
  button:hover { opacity: .9; }
  .del-btn { padding: 1px 6px; font-size: 14px; line-height: 1; background: #fff; color: #c0392b; border: 1px solid #c0392b; border-radius: 3px; cursor: pointer; }

  .footer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .toolbar { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 15px; }
  .hint { font-size: 11px; color: #888; margin-top: 4px; }

  @media print {
    body { background: #fff; padding: 0; font-size: 11px; }
    .sheet { box-shadow: none; padding: 0; max-width: 100%; }
    .toolbar, .row-btns, .del-btn, .hint, th:last-child, td:last-child { display: none !important; }
    fieldset { border-color: #000; }
    th { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    input { border: none !important; background: transparent !important; }
    td.calc { background: #fafafa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    input::placeholder { color: transparent !important; }
    @page { margin: 12mm; }
  }
</style>
</head>
<body>

<div class="sheet">
  <h1>SALES ORDER</h1>

  <div class="toolbar">
    <button class="secondary" onclick="addRow()">+ Add Product Row</button>
    <button class="secondary" onclick="exportCSV()">Export CSV</button>
    <button onclick="window.print()">Print / PDF</button>
  </div>

  <fieldset>
    <legend>Order Header</legend>
    <div class="grid">
      <div class="field"><label>Supplier</label><input type="text" id="supplier"></div>
      <div class="field"><label>Month</label><input type="text" id="month" placeholder="e.g. November"></div>
      <div class="field"><label>Order Ref No</label><input type="text" id="orderRef" oninput="syncRefs()"></div>
      <div class="field"><label>Order Value</label><input type="number" step="0.01" id="orderValue" class="num"></div>
      <div class="field"><label>Date</label><input type="date" id="orderDate" oninput="updateOnHandHeader()"></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Products</legend>
    <table id="productTable">
      <thead>
        <tr>
          <th style="width:120px">Product Code</th>
          <th>Description</th>
          <th style="width:70px">Packs</th>
          <th style="width:90px">CIF</th>
          <th style="width:110px" id="onHandTh">On Hand Balance</th>
          <th style="width:110px">Shipment Due Qty</th>
          <th style="width:120px">Shipment Due Ref</th>
          <th style="width:80px">Quantity</th>
          <th style="width:100px">Total (CIF×Qty)</th>
          <th style="width:80px">AMS</th>
          <th style="width:90px">Stock Duration</th>
          <th style="width:130px">Shipment / Urgency</th>
          <th style="width:120px">ETA</th>
          <th style="width:30px"></th>
        </tr>
      </thead>
      <tbody id="productBody"></tbody>
    </table>
    <div class="hint">Type in Product Code or Description to see suggestions. Packs auto-fills from the product database.</div>
  </fieldset>

  <fieldset>
    <legend>Footer</legend>
    <div class="footer-grid">
      <div class="field"><label>Prepared By</label><input type="text" id="preparedBy"></div>
      <div class="field"><label>Reviewed By</label><input type="text" id="reviewedBy"></div>
    </div>
  </fieldset>
</div>

<script>
/* =========================================================
   PRODUCT DATABASE
   Loaded from products.js via <script src="products.js">
   Expects: window.PRODUCTS_DATA = [{code, description, packs}, ...]
   ========================================================= */
let PRODUCTS = [];

function loadProducts() {
  if (Array.isArray(window.PRODUCTS_DATA)) {
    PRODUCTS = window.PRODUCTS_DATA;
    console.log('Loaded products:', PRODUCTS.length);
  } else {
    console.error('products.js not loaded or PRODUCTS_DATA missing');
    alert('Could not load products.js.\n\nMake sure products.js is in the same folder as index.html and defines window.PRODUCTS_DATA.');
  }
}

/* =========================================================
   HELPERS
   ========================================================= */
const fmt2 = n => (isFinite(n) ? n.toFixed(2) : '');
const todayISO = () => new Date().toISOString().slice(0, 10);

function updateOnHandHeader() {
  const d = document.getElementById('orderDate').value;
  const th = document.getElementById('onHandTh');
  th.textContent = d ? 'On Hand Balance at ' + d : 'On Hand Balance';
}

function syncRefs() {
  const ref = document.getElementById('orderRef').value;
  document.querySelectorAll('.sdref-input').forEach(inp => {
    if (inp.dataset.userEdited !== '1') inp.value = ref;
  });
}

/* =========================================================
   PRODUCT ROW
   ========================================================= */
let rowId = 0;

function addRow(data = {}) {
  const tbody = document.getElementById('productBody');
  const id = ++rowId;
  const tr = document.createElement('tr');
  tr.dataset.id = id;
  tr.innerHTML = `
    <td class="autocomplete">
      <input type="text" class="code-input" autocomplete="off" placeholder="code">
      <div class="ac-list"></div>
    </td>
    <td class="autocomplete">
      <input type="text" class="desc-input" autocomplete="off" placeholder="description">
      <div class="ac-list"></div>
    </td>
    <td class="num"><input type="text" class="packs-input num" readonly></td>
    <td class="num"><input type="number" step="0.01" class="cif-input num"></td>
    <td class="num"><input type="text" class="onhand-input num"></td>
    <td class="num"><input type="text" class="sdq-input num"></td>
    <td><input type="text" class="sdref-input"></td>
    <td class="num"><input type="number" step="1" class="qty-input num"></td>
    <td class="calc total-cell">—</td>
    <td class="num"><input type="number" step="0.01" class="ams-input num"></td>
    <td class="calc dur-cell">—</td>
    <td>
      <select class="shipment-input" style="width:100%;font-size:12px;padding:3px;border:1px solid #bbb;border-radius:3px;background:#fff">
        <option value="">—</option>
        <option>Immediate</option>
        <option>Urgent</option>
        <option>Normal</option>
        <option>Low</option>
        <option>On Hold</option>
        <option value="__date__">Pick a date…</option>
      </select>
      <input type="date" class="shipment-date" style="display:none;width:100%;margin-top:2px;">
    </td>
    <td><input type="date" class="eta-input"></td>
    <td><button class="del-btn" title="Remove row">×</button></td>
  `;
  tbody.appendChild(tr);

  // Wire up
  wireAutocomplete(tr, 'code');
  wireAutocomplete(tr, 'desc');
  tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => recalcRow(tr)));
  tr.querySelector('.sdref-input').addEventListener('input', e => {
    e.target.dataset.userEdited = '1';
  });
  tr.querySelector('.del-btn').addEventListener('click', () => {
    tr.remove();
    ensureAtLeastOneRow();
  });
  tr.querySelector('.shipment-input').addEventListener('change', e => {
    const dateInput = tr.querySelector('.shipment-date');
    if (e.target.value === '__date__') {
      dateInput.style.display = 'block';
      dateInput.focus();
    } else {
      dateInput.style.display = 'none';
      dateInput.value = '';
    }
  });

  // Prefill shipment ref from order ref
  const ref = document.getElementById('orderRef').value;
  if (ref) tr.querySelector('.sdref-input').value = ref;

  // Load any passed-in data
  if (data.code) tr.querySelector('.code-input').value = data.code;
  if (data.description) tr.querySelector('.desc-input').value = data.description;
  if (data.packs) tr.querySelector('.packs-input').value = data.packs;

  updateOnHandHeader();
  recalcRow(tr);
}

function ensureAtLeastOneRow() {
  if (!document.querySelector('#productBody tr')) addRow();
}

/* =========================================================
   AUTOCOMPLETE
   ========================================================= */
function wireAutocomplete(tr, kind) {
  const input = tr.querySelector('.' + kind + '-input');
  const list = tr.querySelectorAll('.ac-list')[kind === 'code' ? 0 : 1];
  const otherKind = kind === 'code' ? 'desc' : 'code';
  const otherInput = tr.querySelector('.' + otherKind + '-input');
  let activeIdx = -1;

  function closeList() { list.style.display = 'none'; activeIdx = -1; }

  function showMatches(query) {
    if (!query || PRODUCTS.length === 0) { closeList(); return; }
    const q = query.toLowerCase();
    const matches = PRODUCTS.filter(p =>
      (kind === 'code' ? p.code : p.description).toLowerCase().includes(q)
    ).slice(0, 50);

    if (!matches.length) { closeList(); return; }

    list.innerHTML = matches.map((p, i) => {
      const code = escapeHtml(p.code);
      const desc = escapeHtml(p.description);
      const packs = escapeHtml(p.packs);
      return `<div data-idx="${i}"><span class="code">${code}</span>${desc}<span class="packs">${packs}</span></div>`;
    }).join('');
    list.style.display = 'block';

    list.querySelectorAll('div').forEach(div => {
      div.addEventListener('mousedown', e => {
        e.preventDefault();
        select(matches[+div.dataset.idx]);
      });
    });
  }

  function select(p) {
    input.value = kind === 'code' ? p.code : p.description;
    otherInput.value = kind === 'code' ? p.description : p.code;
    tr.querySelector('.packs-input').value = p.packs;
    closeList();
    recalcRow(tr);
  }

  input.addEventListener('input', () => showMatches(input.value));
  input.addEventListener('focus', () => { if (input.value) showMatches(input.value); });
  input.addEventListener('blur', () => setTimeout(closeList, 150));

  input.addEventListener('keydown', e => {
    const items = list.querySelectorAll('div');
    if (!items.length || list.style.display === 'none') return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      items.forEach((d, i) => d.classList.toggle('active', i === activeIdx));
      items[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      items.forEach((d, i) => d.classList.toggle('active', i === activeIdx));
      items[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (activeIdx >= 0) { e.preventDefault(); items[activeIdx].dispatchEvent(new MouseEvent('mousedown')); }
    } else if (e.key === 'Escape') {
      closeList();
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* =========================================================
   CALCULATIONS
   ========================================================= */
function num(el) { const v = parseFloat(el.value); return isFinite(v) ? v : 0; }

function recalcRow(tr) {
  const cif = num(tr.querySelector('.cif-input'));
  const qty = num(tr.querySelector('.qty-input'));
  const onhand = num(tr.querySelector('.onhand-input'));
  const sdq = num(tr.querySelector('.sdq-input'));
  const ams = num(tr.querySelector('.ams-input'));

  const totalCell = tr.querySelector('.total-cell');
  const durCell = tr.querySelector('.dur-cell');

  const hasTotal = tr.querySelector('.cif-input').value !== '' && tr.querySelector('.qty-input').value !== '';
  totalCell.textContent = hasTotal ? fmt2(cif * qty) : '—';

  if (ams > 0) {
    durCell.textContent = fmt2((sdq + onhand) / ams);
  } else {
    durCell.textContent = 'N/A';
  }
}

/* =========================================================
   CSV EXPORT  — mirrors the on-screen layout
   ========================================================= */
function csvEscape(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const rows = [];

  // Header block
  rows.push(['SALES ORDER']);
  rows.push([]);
  rows.push(['Supplier', document.getElementById('supplier').value]);
  rows.push(['Month', document.getElementById('month').value]);
  rows.push(['Order Ref No', document.getElementById('orderRef').value]);
  rows.push(['Order Value', document.getElementById('orderValue').value]);
  rows.push(['Date', document.getElementById('orderDate').value]);
  rows.push([]);

  // Product table headers (mirror on-screen)
  const onHandHeader = document.getElementById('onHandTh').textContent;
  rows.push([
    'Product Code', 'Description', 'Packs', 'CIF', onHandHeader,
    'Shipment Due Qty', 'Shipment Due Ref', 'Quantity', 'Total (CIF×Qty)',
    'AMS', 'Stock Duration', 'Shipment / Urgency', 'ETA'
  ]);

  document.querySelectorAll('#productBody tr').forEach(tr => {
    const shipmentSel = tr.querySelector('.shipment-input').value;
    const shipmentDate = tr.querySelector('.shipment-date').value;
    const shipment = shipmentSel === '__date__' ? shipmentDate : shipmentSel;

    rows.push([
      tr.querySelector('.code-input').value,
      tr.querySelector('.desc-input').value,
      tr.querySelector('.packs-input').value,
      tr.querySelector('.cif-input').value,
      tr.querySelector('.onhand-input').value,
      tr.querySelector('.sdq-input').value,
      tr.querySelector('.sdref-input').value,
      tr.querySelector('.qty-input').value,
      tr.querySelector('.total-cell').textContent === '—' ? '' : tr.querySelector('.total-cell').textContent,
      tr.querySelector('.ams-input').value,
      tr.querySelector('.dur-cell').textContent,
      shipment,
      tr.querySelector('.eta-input').value
    ]);
  });

  rows.push([]);
  rows.push(['Prepared By', document.getElementById('preparedBy').value]);
  rows.push(['Reviewed By', document.getElementById('reviewedBy').value]);

  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ref = document.getElementById('orderRef').value || 'sales-order';
  a.download = `SalesOrder_${ref}_${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================
   INIT
   ========================================================= */
window.addEventListener('DOMContentLoaded', () => {
  // Default date
  if (!document.getElementById('orderDate').value) {
    document.getElementById('orderDate').value = todayISO();
  }
  updateOnHandHeader();
  loadProducts();
  addRow();
});
</script>
</body>
</html>
